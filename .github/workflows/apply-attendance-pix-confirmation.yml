name: Apply attendance PIX confirmation

on:
  push:
    branches:
      - fix/presenca-confirmacao-pix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/presenca-confirmacao-pix
          fetch-depth: 0
      - name: Apply focused patch
        run: python3 .github/apply_attendance_patch.py
      - name: Validate patch shape
        run: |
          grep -q "Confirmo que meu cargo e minha chave PIX estão corretos" src/pages/processo-seletivo/public/PsPublicAttendance.tsx
          grep -q "x-ps-details-confirmed" supabase/functions/ps-public-signature/index.ts
          grep -q "x-ps-action': 'details'" src/lib/signatureStorage.ts
      - name: Commit final patch
        run: |
          rm .github/apply_attendance_patch.py
          rm .github/workflows/apply-attendance-pix-confirmation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: simplificar confirmação de presença e exibir PIX"
          git push origin HEAD:fix/presenca-confirmacao-pix
