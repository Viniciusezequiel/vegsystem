name: Apply Processo Seletivo correction

on:
  push:
    branches:
      - fix/processo-seletivo-pdf-dropdown

permissions:
  contents: write

jobs:
  apply-source-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/processo-seletivo-pdf-dropdown
          fetch-depth: 0

      - name: Apply focused source correction
        run: node scripts/apply-ps-correction.mjs

      - name: Remove temporary correction tooling
        run: rm scripts/apply-ps-correction.mjs .github/workflows/apply-ps-correction.yml

      - name: Commit corrected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: integrar cargos e assinatura ao processo seletivo"
          git push origin HEAD:fix/processo-seletivo-pdf-dropdown
