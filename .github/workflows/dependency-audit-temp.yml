name: Dependency Audit Temp

on:
  push:
    branches:
      - cleanup/temp-signature-maintenance

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full audit
        shell: bash
        run: |
          npm audit --json > audit-full.json || true
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit-full.json', 'utf8'));
          console.log('=== FULL AUDIT ===');
          console.log(JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, v] of Object.entries(data.vulnerabilities ?? {})) {
            console.log(JSON.stringify({name, severity:v.severity, isDirect:v.isDirect, range:v.range, nodes:v.nodes, fixAvailable:v.fixAvailable, via:v.via}, null, 2));
          }
          NODE

      - name: Production-only audit
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit-prod.json', 'utf8'));
          console.log('=== PROD AUDIT ===');
          console.log(JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, v] of Object.entries(data.vulnerabilities ?? {})) {
            console.log(JSON.stringify({name, severity:v.severity, isDirect:v.isDirect, range:v.range, nodes:v.nodes, fixAvailable:v.fixAvailable, via:v.via}, null, 2));
          }
          NODE

      - name: Babel dependency check
        shell: bash
        run: |
          npm ls @babel/core @babel/plugin-transform-modules-systemjs || true
