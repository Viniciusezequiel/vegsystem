name: Temporary PS Event Locations Integration

on:
  push:
    branches:
      - feat/ps-event-locations

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ps-event-locations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix literal template expression in temporary patcher
        run: sed -i 's/${event.name}/\\${event.name}/g' scripts/patch-ps-event-locations.mjs
      - name: Apply integration patch
        run: node scripts/patch-ps-event-locations.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:storage
      - name: Production build
        run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase tests
          git commit -m "feat: integrate structured event locations"
          git push origin HEAD:feat/ps-event-locations
